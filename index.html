<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Voxel Earth & Moon + Stars – Three.js</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    canvas { display: block; }
    #info {
      position: absolute;
      top: 10px;
      left: 10px;
      color: #88f;
      font-family: Arial, Helvetica, sans-serif;
      pointer-events: none;
      user-select: none;
      z-index: 10;
    }
  </style>
</head>
<body>

<div id="info">Voxel Earth + Moon + Stars • drag to rotate • scroll to zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.182.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ────────────────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000814); // very dark blue-black

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 2000);
camera.position.set(45, 28, 60);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.04;
controls.minDistance = 20;
controls.maxDistance = 500; // allow zooming out to see more stars

// ─── Sun (Optimized with InstancedMesh) ──────────────────────────
const sunGroup = new THREE.Group();
scene.add(sunGroup);

const sunRadius = 15;
const sunPos = new THREE.Vector3(1500, 0, 100);

// 1. Pre-calculate how many voxels we actually need
let voxelCount = 0;
for (let x = -sunRadius; x <= sunRadius; x++) {
  for (let y = -sunRadius; y <= sunRadius; y++) {
    for (let z = -sunRadius; z <= sunRadius; z++) {
      if (Math.hypot(x, y, z) <= sunRadius) voxelCount++;
    }
  }
}

// 2. Create ONE InstancedMesh instead of thousands of individual Meshes
const sunGeo = new THREE.BoxGeometry(1, 1, 1);
const sunMat = new THREE.MeshStandardMaterial({
  emissive: 0xffcc00,
  emissiveIntensity: 2.0, // High intensity for bloom
  flatShading: true
});

const instancedSun = new THREE.InstancedMesh(sunGeo, sunMat, voxelCount);
const dummy = new THREE.Object3D();
const colorObj = new THREE.Color();
let idx = 0;

for (let x = -sunRadius; x <= sunRadius; x++) {
  for (let y = -sunRadius; y <= sunRadius; y++) {
    for (let z = -sunRadius; z <= sunRadius; z++) {
      const dist = Math.hypot(x, y, z);
      if (dist > sunRadius) continue;

      // Set Position
      dummy.position.set(x + 0.5, y + 0.5, z + 0.5);
      dummy.updateMatrix();
      instancedSun.setMatrixAt(idx, dummy.matrix);

      // Set Color (Core vs Shell)
      const isCore = dist < sunRadius * 0.8;
      colorObj.setHex(isCore ? 0xffcc00 : 0xff9900);
      instancedSun.setColorAt(idx, colorObj);

      idx++;
    }
  }
}

sunGroup.add(instancedSun);
sunGroup.position.copy(sunPos);

// ─── Lights ───────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0xffffff, 0.6));

const sun = new THREE.DirectionalLight(0xfff8e8, 1.8);
//sun.position.set(100, 60, 80);
sun.position.copy(sunPos);
scene.add(sun);

const moonLight = new THREE.DirectionalLight(0xaaccff, 0.4);
moonLight.position.set(-40, 0, -40);
scene.add(moonLight);

// ─── Voxel helper ──────────────────────────────────────────────────
function createVoxel(x, y, z, color, scale = 1) {
  const geo = new THREE.BoxGeometry(scale, scale, scale);
  const mat = new THREE.MeshStandardMaterial({
    color,
    emissive: color,          // slight glow for stars
    //emissiveIntensity: 0.3,
    emissiveIntensity: 0.05,
    roughness: 0.9,
    metalness: 0.0,
    flatShading: true
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, y, z);
  return mesh;
}

// ─── Stars (distant voxel background) ──────────────────────────────
const starsGroup = new THREE.Group();
scene.add(starsGroup);

const starCount = 1000;
const starRadius = 350; // far away
const starSizeBase = 0.6;

for (let i = 0; i < starCount; i++) {
  // Random point on sphere
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);

  let x = starRadius * Math.sin(phi) * Math.cos(theta);
  let y = starRadius * Math.sin(phi) * Math.sin(theta);
  let z = starRadius * Math.cos(phi);

  // Small random offset to avoid perfect grid look
  x += (Math.random() - 0.5) * 40;
  y += (Math.random() - 0.5) * 40;
  z += (Math.random() - 0.5) * 40;

  // Slight color variation: white → slight yellow/blue
  const temp = 0.85 + Math.random() * 0.3;
  const color = new THREE.Color().setHSL(0.1, 0.1, temp);

  // Random size variation
  const size = starSizeBase * (0.4 + Math.random() * 0.6);

  const star = createVoxel(x, y, z, color, size);
  starsGroup.add(star);
}

// ─── Earth ─────────────────────────────────────────────────────────
const earthGroup = new THREE.Group();
scene.add(earthGroup);

const earthRadius = 12;

for (let x = -earthRadius; x <= earthRadius; x++) {
  for (let y = -earthRadius; y <= earthRadius; y++) {
    for (let z = -earthRadius; z <= earthRadius; z++) {
      const dist = Math.hypot(x, y, z);
      if (dist > earthRadius || dist < earthRadius - 1.4) continue;

      let color = 0x000000;

      const noise = Math.sin(x*0.9)*Math.sin(y*0.7)*Math.sin(z*0.8) +
                    Math.sin(x*1.4 + y*1.1)*0.4;

      if (dist > earthRadius - 0.5) {
        if (noise > 0.15)      color = 0x3a7d3a;     // land
        else if (noise > -0.1) color = 0x4a6fc4;     // shallow
        else                   color = 0x1e3a8a;     // deep ocean
      } else {
        color = 0x2a4a2a;
      }

      if (Math.abs(y) > earthRadius * 0.75) {
        color = 0xf0f8ff; // ice
      }

      earthGroup.add(createVoxel(x + 0.5, y + 0.5, z + 0.5, color));
    }
  }
}

// ─── Moon ──────────────────────────────────────────────────────────
const moonGroup = new THREE.Group();
scene.add(moonGroup);

const moonRadius = 5;
const moonBaseOffset = 38 * 4;

for (let x = -moonRadius; x <= moonRadius; x++) {
  for (let y = -moonRadius; y <= moonRadius; y++) {
    for (let z = -moonRadius; z <= moonRadius; z++) {
      const dist = Math.hypot(x, y, z);
      if (dist > moonRadius || dist < moonRadius - 1.2) continue;

      const craterNoise = Math.sin(x*2.3 + y*1.8 + z*2.1)*0.5 +
                          Math.sin(x*3.7)*0.3;

      let gray = 0.60 + craterNoise * 0.15;
      gray = Math.max(0.38, Math.min(0.92, gray));

      const color = new THREE.Color(gray, gray, gray + 0.02).getHex();

      const voxel = createVoxel(x + 0.5, y + 0.5, z + 0.5, color);
      //voxel.position.add(new THREE.Vector3(moonBaseOffset, 6, -moonBaseOffset * 0.4));
      moonGroup.add(voxel);
    }
  }
}

// ─── Post-processing ──────────────────────────────────────────────
const renderScene = new RenderPass(scene, camera);

// Parameters: (resolution, strength, radius, threshold)
const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  0.3,  // Strength: How intense the glow is
  0.4,  // Radius: How far the glow spreads
  0.1   // Threshold: Min brightness needed to glow
);

const outputPass = new OutputPass();

const composer = new EffectComposer(renderer);
composer.addPass(renderScene);
composer.addPass(bloomPass);
composer.addPass(outputPass);

// ─── Animation ─────────────────────────────────────────────────────
let time = 0;

function animate() {
  requestAnimationFrame(animate);

  time += 0.003;

  earthGroup.rotation.y += 0.0015;
  //moonGroup.rotation.y += 0.002;

  // Sun pulse
  sunGroup.rotation.y += 0.001;
  const sunPulse = 1 + Math.sin(time * 2) * 0.02;
  sunGroup.scale.set(sunPulse, sunPulse, sunPulse);

  // Moon orbit
  const angle = time * 0.18;
  moonGroup.position.x = Math.cos(angle) * moonBaseOffset;
  moonGroup.position.z = Math.sin(angle) * moonBaseOffset * 0.7;
  moonGroup.position.y = Math.sin(angle * 1.3) * 4;

  controls.update();
  //renderer.render(scene, camera);
  // Use the composer instead of the renderer
  composer.render();
}

animate();

// ─── Resize ────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
