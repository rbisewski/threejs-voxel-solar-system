<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>High-Detail Voxel Solar System – with Line Orbits</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    canvas { display: block; }
    #info {
      position: absolute; top: 10px; left: 10px;
      color: #88f; font-family: Arial, sans-serif;
      pointer-events: none; user-select: none; z-index: 10;
    }
  </style>
</head>
<body>

<div id="info">Voxel Solar System • Smooth Line Orbits • Dynamic Earth • Gas Giant Moons • Scroll to Zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.182.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ─── Scene Setup ─────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000205);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 1, 15000);
camera.position.set(2800, 1500, 3200);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxDistance = 12000;

const voxelGeo = new THREE.BoxGeometry(1, 1, 1);
const dummy = new THREE.Object3D();
const colorObj = new THREE.Color();

// ─── Sun ──────────────────────────────────────────────────────────
const sunPos = new THREE.Vector3(1500, 0, 100);
const sunRadius = 45;
const sunGroup = new THREE.Group();
sunGroup.position.copy(sunPos);
scene.add(sunGroup);

const sunMat = new THREE.MeshStandardMaterial({ emissive: 0xffaa00, emissiveIntensity: 2.5, flatShading: true });

let sunVoxels = [];
for (let x=-sunRadius; x<=sunRadius; x+=2) 
    for (let y=-sunRadius; y<=sunRadius; y+=2) 
        for (let z=-sunRadius; z<=sunRadius; z+=2) 
            if (Math.hypot(x,y,z) <= sunRadius) sunVoxels.push([x,y,z]);

const sunInst = new THREE.InstancedMesh(voxelGeo, sunMat, sunVoxels.length);
sunVoxels.forEach((v, i) => { dummy.position.set(v[0], v[1], v[2]); dummy.updateMatrix(); sunInst.setMatrixAt(i, dummy.matrix); });
sunGroup.add(sunInst);

const sunLight = new THREE.PointLight(0xffffff, 15, 10000, 0.6);
sunLight.position.copy(sunPos);
scene.add(sunLight);
scene.add(new THREE.AmbientLight(0xffffff, 0.15));

// ─── Stars ────────────────────────────────────────────────────────
const starCount = 2500;
const starInst = new THREE.InstancedMesh(voxelGeo, new THREE.MeshBasicMaterial({color: 0xffffff}), starCount);
for (let i = 0; i < starCount; i++) {
    const r = 7000 + Math.random() * 2000;
    const theta = Math.random() * Math.PI * 2, phi = Math.acos(2 * Math.random() - 1);
    dummy.position.set(r*Math.sin(phi)*Math.cos(theta)+sunPos.x, r*Math.sin(phi)*Math.sin(theta)+sunPos.y, r*Math.cos(phi)+sunPos.z);
    dummy.scale.setScalar(2+Math.random()*3); dummy.updateMatrix(); starInst.setMatrixAt(i, dummy.matrix);
}
scene.add(starInst);

// ─── Orbit Line Helper ────────────────────────────────────────────
function addOrbitLine(orbitGroup, radius, color = 0x3366ff, opacity = 0.35) {
    const segments = 120;
    const points = [];

    for (let i = 0; i <= segments; i++) {
        const angle = (i / segments) * Math.PI * 2;
        const x = radius * Math.cos(angle);
        const z = radius * Math.sin(angle);
        points.push(new THREE.Vector3(x, 0, z));   // ← x & z swapped roles → lies in XZ plane
    }

    const geometry = new THREE.BufferGeometry().setFromPoints(points);

    const material = new THREE.LineBasicMaterial({
        color: color,
        transparent: true,
        opacity: opacity,
        linewidth: 1.4   // slight bump; still driver-limited in most cases
    });

    const line = new THREE.LineLoop(geometry, material);
    orbitGroup.add(line);
}

// ─── Moon / Satellite Helper ──────────────────────────────────────
function createMoonSystem(parent, count, distBase, moonRadius, colorHex) {
    const moons = [];
    for(let i=0; i<count; i++) {
        const pivot = new THREE.Group();
        parent.add(pivot);
        const moonMat = new THREE.MeshStandardMaterial({color: colorHex});
        const mInst = new THREE.InstancedMesh(voxelGeo, moonMat, 64);
        let mIdx = 0;
        for(let x=-moonRadius; x<=moonRadius; x++)
            for(let y=-moonRadius; y<=moonRadius; y++)
                for(let z=-moonRadius; z<=moonRadius; z++)
                    if(Math.hypot(x,y,z) <= moonRadius && mIdx < 64) {
                        dummy.position.set(x,y,z); dummy.updateMatrix(); mInst.setMatrixAt(mIdx++, dummy.matrix);
                    }
        mInst.position.x = distBase + (i * 15);
        pivot.add(mInst);
        moons.push({ pivot, speed: 0.01 + Math.random() * 0.02 });
    }
    return moons;
}

// ─── Planet Factory ───────────────────────────────────────────────
const planets = [];
const moonAnims = [];

function createPlanet(radius, orbitDist, color, speed, isEarth=false, hasRings=false, moonCount=0) {
    const orbitGroup = new THREE.Group();
    orbitGroup.position.copy(sunPos);
    scene.add(orbitGroup);

    // Add smooth line orbit
    addOrbitLine(orbitGroup, orbitDist, 0x3366ff, 0.025);

    const planetContainer = new THREE.Group();
    orbitGroup.add(planetContainer);

    let voxels = [];
    for (let x=-radius; x<=radius; x++) 
        for (let y=-radius; y<=radius; y++) 
            for (let z=-radius; z<=radius; z++) {
                const d = Math.hypot(x,y,z);
                if (d <= radius && d > radius-1.8) voxels.push({x,y,z});
            }

    const mat = new THREE.MeshStandardMaterial({ vertexColors: isEarth, color: isEarth ? 0xffffff : color, flatShading: true });
    const inst = new THREE.InstancedMesh(voxelGeo, mat, voxels.length);
    
    voxels.forEach((v, i) => {
        dummy.position.set(v.x, v.y, v.z); dummy.updateMatrix(); inst.setMatrixAt(i, dummy.matrix);
        if (isEarth) {
            const noise = Math.sin(v.x*0.4)*Math.sin(v.y*0.3)*Math.sin(v.z*0.5);
            if (Math.abs(v.y) > radius * 0.85) colorObj.setHex(0xffffff); // Ice caps
            else if (noise > 0.1) colorObj.setHex(0x3a7d3a); // Continents
            else colorObj.setHex(0x2244ff); // Oceans
            inst.setColorAt(i, colorObj);
        }
    });

    planetContainer.add(inst);
    planetContainer.position.x = orbitDist;

    if (hasRings) {
        let rv = [];
        for (let x=-radius*2.2; x<=radius*2.2; x++) 
            for (let z=-radius*2.2; z<=radius*2.2; z++) 
                if (Math.hypot(x,z) > radius*1.4 && Math.hypot(x,z) < radius*2.1 && Math.random()>0.4) rv.push([x,0,z]);
        const rInst = new THREE.InstancedMesh(voxelGeo, new THREE.MeshStandardMaterial({color: 0x998877, transparent:true, opacity:0.7}), rv.length);
        rv.forEach((v,i) => { dummy.position.set(v[0],v[1],v[2]); dummy.updateMatrix(); rInst.setMatrixAt(i, dummy.matrix); });
        planetContainer.add(rInst);
    }

    if (moonCount > 0) {
        const ms = createMoonSystem(planetContainer, moonCount, radius + 15, 2, 0xaaaaaa);
        moonAnims.push(...ms);
    }

    const data = { orbitGroup, planetContainer, speed, angle: Math.random() * 6 };
    planets.push(data);
    return data;
}

// ─── Build System ─────────────────────────────────────────────────
createPlanet(6,  250,  0x8c8c8c, 0.015);     // Mercury
createPlanet(12, 450,  0xe3bb76, 0.012);     // Venus
createPlanet(13, 750,  0x2244ff, 0.010, false, false, 1);  // Earth + Moon
createPlanet(9,  1100, 0xff4500, 0.008);     // Mars
createPlanet(35, 1700, 0xd39c7e, 0.005, false, false, 4); // Jupiter + moons
createPlanet(30, 2300, 0xead6b8, 0.004, false, true, 3);  // Saturn + moons + rings
createPlanet(20, 2800, 0xbbe1e4, 0.003);     // Uranus
createPlanet(20, 3200, 0x6081ff, 0.002);     // Neptune

// ─── Rendering ────────────────────────────────────────────────────
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.7, 0.4, 0.15)); // slightly boosted bloom for orbit glow
composer.addPass(new OutputPass());

function animate() {
    requestAnimationFrame(animate);
    planets.forEach(p => { 
        p.angle += p.speed * 0.4; 
        p.orbitGroup.rotation.y = p.angle; 
        p.planetContainer.rotation.y += 0.005; 
    });
    moonAnims.forEach(m => { 
        m.pivot.rotation.y += m.speed; 
        m.pivot.rotation.x += 0.001; 
    });
    sunGroup.scale.setScalar(1 + Math.sin(Date.now()*0.002)*0.02);
    controls.update();
    composer.render();
}
animate();

window.addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
